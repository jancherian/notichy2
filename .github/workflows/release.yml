name: Release Notch Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'coucou-windows-v0.5.3/windows/package-lock.json'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'coucou-windows-v0.5.3/windows -> coucou-windows-v0.5.3/windows/src-tauri/target'

      - name: Install Frontend Dependencies
        working-directory: coucou-windows-v0.5.3/windows
        run: npm ci

      - name: Build Frontend
        working-directory: coucou-windows-v0.5.3/windows
        run: npm run build

      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './coucou-windows-v0.5.3/windows'
          tagName: ${{ github.ref_name }}
          releaseName: 'Notch Companion ${{ github.ref_name }}'
          releaseBody: |
            ## Notch Companion ${{ github.ref_name }}
            
            An ambient desktop companion for focus, ergonomics, and daily wellbeing.
            
            ### Highlights
            - 100% Offline: Zero telemetry, local storage only.
            - Pose & Posture Detection via local MediaPipe WASM.
            - Focus timer with active task pill binding.
            - Micro-habits with authentic streaks.
            - Guided wellbeing breaks & daily summary.
            
            ### Installation Note (Windows SmartScreen)
            The binary is unsigned. If Windows SmartScreen displays a warning, click **"More info"** and then **"Run anyway"**.
          releaseDraft: false
          prerelease: false

      - name: Package rolling Notch-Setup.exe
        shell: pwsh
        run: |
          $installer = Get-ChildItem coucou-windows-v0.5.3/windows/target/release/bundle/nsis/*-setup.exe | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($installer) {
            Write-Host "Found installer: $($installer.FullName)"
            Copy-Item $installer.FullName "coucou-windows-v0.5.3/windows/target/release/bundle/nsis/Notch-Setup.exe"
          }

      - name: Upload Notch-Setup.exe to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            coucou-windows-v0.5.3/windows/target/release/bundle/nsis/Notch-Setup.exe

